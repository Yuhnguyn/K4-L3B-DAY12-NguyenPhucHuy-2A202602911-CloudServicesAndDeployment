# CP5 — Cấu hình deploy Render (dùng nếu bạn chọn Render).
#
# Render đọc file này khi bạn tạo Blueprint từ repo GitHub.
# `sync: false` = Render hỏi giá trị lúc deploy, KHÔNG lưu secret vào repo.

services:
  - type: web
    name: day12-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: REDIS_URL
        fromService:
          name: day12-redis
          # `keyvalue` là cách viết hiện tại; `redis` chỉ còn là alias cũ
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: day12-redis
    plan: free
    # [] = không mở ra Internet, chỉ service trong cùng workspace truy cập
    # được qua private network — đúng thứ agent cần, và an toàn hơn.
    ipAllowList: []
    # Lưu ý của plan free: Key Value free KHÔNG ghi xuống đĩa, nên mọi
    # restart/maintenance của Render sẽ xoá sạch history/cost/ratelimit.
    # Chấp nhận được cho bài lab; production thì phải trả phí để có persistence.
