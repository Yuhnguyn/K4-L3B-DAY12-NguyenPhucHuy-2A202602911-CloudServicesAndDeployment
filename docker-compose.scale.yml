# CP4 — Override để chạy NHIỀU instance agent sau nginx (phần mở rộng tùy chọn).
#
# Vì sao cần file này: `docker-compose.yml` publish cố định cổng host 8000
# cho service `agent`, mà 3 container không thể cùng chiếm một cổng host →
# `docker compose up --scale agent=3` sẽ báo "port is already allocated".
# Ở đây bỏ publish cổng của `agent` (chỉ nginx lộ ra ngoài) để scale được.
#
# Dùng:
#     docker compose -f docker-compose.yml -f docker-compose.scale.yml \
#         up -d --scale agent=3
#     curl http://localhost:8080/health
#
# nginx round-robin qua các IP mà Docker DNS trả về cho hostname `agent`
# (tên service = hostname). Đây chính là lý do app phải stateless: hai request
# liên tiếp của cùng một user có thể rơi vào hai container khác nhau.

services:
  agent:
    # !override = thay hẳn danh sách ports của file gốc, không merge thêm
    ports: !override []

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - agent
